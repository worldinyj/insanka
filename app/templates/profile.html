{% extends "base.html" %}

{% block title %}내 프로필 - 인산가{% endblock %}

{% block content %}
<div class="max-w-4xl w-full" x-data="{
    profile: null,
    activities: { posts: [], comments: [] },
    me: null,
    activeTab: 'points', // 'points' or 'activities'
    editMode: false,
    editForm: { bio: '', avatar_url: '' },
    loadingProfile: false,
    passwordForm: { current_password: '', new_password: '' },
    loadingPassword: false,
    async loadProfile() {
        const res = await fetch('/api/v1/users/me/points');
        this.profile = await res.json();
    },
    async loadMe() {
        const res = await fetch('/api/v1/users/me');
        if (res.ok) {
            this.me = await res.json();
            this.editForm.bio = this.me.bio || '';
            this.editForm.avatar_url = this.me.avatar_url || '';
        }
    },
    async loadActivities() {
        const pRes = await fetch('/api/v1/users/me/posts');
        if (pRes.ok) {
            const data = await pRes.json();
            this.activities.posts = data.posts;
        }
        const cRes = await fetch('/api/v1/users/me/comments');
        if (cRes.ok) {
            const data = await cRes.json();
            this.activities.comments = data.comments;
        }
    },
    async saveProfile() {
        this.loadingProfile = true;
        try {
            const res = await fetch('/api/v1/users/me', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(this.editForm)
            });
            if (res.ok) {
                showToast('프로필이 업데이트 되었습니다.', 'success');
                this.editMode = false;
                await this.loadMe();
            } else {
                showToast('프로필 업데이트 실패', 'error');
            }
        } finally {
            this.loadingProfile = false;
        }
    },
    async updatePassword() {
        if (!this.passwordForm.current_password || !this.passwordForm.new_password) return;
        this.loadingPassword = true;
        try {
            const res = await fetch('/api/v1/users/me/password', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(this.passwordForm)
            });
            if (res.ok) {
                showToast('비밀번호가 성공적으로 변경되었습니다.', 'success');
                this.passwordForm.current_password = '';
                this.passwordForm.new_password = '';
            } else {
                const data = await res.json();
                showToast(data.detail || '비밀번호 변경 실패', 'error');
            }
        } finally {
            this.loadingPassword = false;
        }
    },
    getProgress(points, level) {
        // Mock threshold logic, must match backend
        const thresholds = {1:0, 2:100, 3:500, 4:2000, 5:10000};
        const currentThresh = thresholds[level] || 0;
        const nextThresh = thresholds[level+1] || currentThresh;
        if (nextThresh === currentThresh) return 100;
        return Math.min(100, Math.max(0, ((points - currentThresh) / (nextThresh - currentThresh)) * 100));
    },
    getNextLevelPoints(level) {
        const thresholds = {1:0, 2:100, 3:500, 4:2000, 5:10000};
        return thresholds[level+1] || 'MAX';
    }
}" x-init="loadProfile(); loadMe(); loadActivities();">

    <template x-if="profile">
        <div class="space-y-6">
            <!-- User Info and Level Progress -->
            <div class="bg-bg-surface border border-border p-5 sm:p-8 rounded-xl shadow-lg">
                <div class="flex flex-col md:flex-row justify-between mb-4 gap-6">
                    <!-- Left: Profile Info -->
                    <div class="flex items-start space-x-6">
                        <!-- Avatar -->
                        <div class="shrink-0">
                            <template x-if="me?.avatar_url">
                                <img :src="me.avatar_url" alt="아바타" class="w-24 h-24 rounded-full object-cover border-2 border-accent">
                            </template>
                            <template x-if="!me?.avatar_url">
                                <div class="w-24 h-24 rounded-full bg-border flex items-center justify-center text-3xl font-bold text-text-secondary border-2 border-transparent">
                                    <span x-text="me?.username.charAt(0).toUpperCase()"></span>
                                </div>
                            </template>
                        </div>
                        
                        <!-- Details -->
                        <div class="flex-1">
                            <div class="flex items-center space-x-3 mb-1">
                                <h1 class="text-xl sm:text-2xl font-bold text-text-primary" x-text="me?.username"></h1>
                                <span class="bg-accent bg-opacity-20 text-accent px-2 py-0.5 rounded-full text-xs font-bold" x-text="me?.role === 'admin' ? '운영자' : (me?.role === 'editor' ? '스태프' : '일반')"></span>
                            </div>
                            <p class="text-sm text-text-secondary mb-3" x-text="me?.email"></p>
                            
                            <!-- Bio display -->
                            <template x-if="!editMode">
                                <div>
                                    <template x-if="me?.bio">
                                        <p class="text-sm text-text-primary whitespace-pre-wrap bg-bg-base p-3 rounded" x-text="me.bio"></p>
                                    </template>
                                    <template x-if="!me?.bio">
                                        <p class="text-sm text-text-muted italic">아직 작성된 소개글이 없습니다.</p>
                                    </template>
                                    <button @click="editMode = true" class="mt-3 text-sm text-accent hover:underline font-medium">프로필 수정</button>
                                </div>
                            </template>
                            
                            <!-- Bio Edit Form -->
                            <template x-if="editMode">
                                <form @submit.prevent="saveProfile()" class="space-y-3 bg-bg-base p-4 rounded border border-border">
                                    <div>
                                        <label class="block text-xs text-text-secondary mb-1">아바타 URL (선택)</label>
                                        <input type="url" x-model="editForm.avatar_url" placeholder="https://example.com/image.jpg" class="w-full px-3 py-1.5 bg-white border border-border rounded text-sm focus:border-accent focus:outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-xs text-text-secondary mb-1">소개글 (Bio)</label>
                                        <textarea x-model="editForm.bio" rows="3" placeholder="자신을 소개해주세요." class="w-full px-3 py-1.5 bg-white border border-border rounded text-sm focus:border-accent focus:outline-none resize-none"></textarea>
                                    </div>
                                    <div class="flex space-x-2">
                                        <button type="submit" :disabled="loadingProfile" class="px-4 py-1.5 bg-accent text-bg-base text-sm font-medium rounded hover:opacity-90 disabled:opacity-50">저장</button>
                                        <button type="button" @click="editMode = false" class="px-4 py-1.5 bg-border text-text-primary text-sm font-medium rounded hover:bg-opacity-80">취소</button>
                                    </div>
                                </form>
                            </template>
                        </div>
                    </div>

                    <!-- Right: Level and Points -->
                    <div class="text-left md:text-right shrink-0 mt-4 md:mt-0 p-4 md:p-0 bg-bg-base md:bg-transparent rounded-lg">
                        <div class="text-text-secondary text-sm font-medium mb-1">현재 등급</div>
                        <div class="text-3xl font-bold text-accent mb-1">Lv <span x-text="profile.level"></span></div>
                        <div class="text-text-primary font-bold"><span x-text="profile.total_points.toLocaleString()"></span> pts</div>
                    </div>
                </div>

                <div class="mt-6 pt-6 border-t border-border">
                    <h3 class="text-sm font-bold text-text-primary mb-4">비밀번호 변경</h3>
                    <form @submit.prevent="updatePassword()" class="max-w-sm space-y-3">
                        <div>
                            <label class="block text-xs text-text-secondary mb-1">현재 비밀번호</label>
                            <input type="password" x-model="passwordForm.current_password" required class="w-full px-3 py-1.5 bg-bg-base border border-border rounded text-sm focus:border-accent focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-text-secondary mb-1">새 비밀번호</label>
                            <input type="password" x-model="passwordForm.new_password" required class="w-full px-3 py-1.5 bg-bg-base border border-border rounded text-sm focus:border-accent focus:outline-none">
                        </div>
                        <button type="submit" :disabled="loadingPassword" class="px-4 py-1.5 bg-accent text-bg-base text-sm font-medium rounded hover:opacity-90 disabled:opacity-50 transition">
                            <span x-text="loadingPassword ? '처리 중...' : '비밀번호 변경'"></span>
                        </button>
                    </form>
                </div>

                <div class="mt-6 pt-6 border-t border-border">
                    <div class="flex justify-between text-sm mb-2">
                        <span class="text-text-secondary">다음 레벨까지</span>
                        <span class="text-text-primary font-medium">
                            <span x-text="profile.total_points.toLocaleString()"></span> / <span x-text="getNextLevelPoints(profile.level).toLocaleString()"></span>
                        </span>
                    </div>
                    <div class="w-full bg-bg-base rounded-full h-3">
                        <div class="bg-accent h-3 rounded-full transition-all duration-500" :style="`width: ${getProgress(profile.total_points, profile.level)}%`"></div>
                    </div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="flex space-x-1 border-b border-border mt-6">
                <button @click="activeTab = 'points'" 
                        :class="activeTab === 'points' ? 'border-accent text-accent' : 'border-transparent text-text-secondary hover:text-text-primary'"
                        class="px-4 py-3 font-semibold text-sm sm:text-base border-b-2 transition">
                    포인트 획득 내역
                </button>
                <button @click="activeTab = 'activities'" 
                        :class="activeTab === 'activities' ? 'border-accent text-accent' : 'border-transparent text-text-secondary hover:text-text-primary'"
                        class="px-4 py-3 font-semibold text-sm sm:text-base border-b-2 transition">
                    나의 활동 (글/댓글)
                </button>
            </div>

            <!-- Point Logs -->
            <div x-show="activeTab === 'points'" class="bg-bg-surface border border-border rounded-xl shadow-lg overflow-hidden">
                <ul class="divide-y divide-border">
                    <template x-for="log in profile.logs" :key="log.id">
                        <li class="px-4 sm:px-6 py-3 sm:py-4 flex flex-row justify-between items-center hover:bg-bg-raised transition">
                            <div class="flex-1 mr-4">
                                <span class="text-sm sm:text-base text-text-primary font-medium line-clamp-1" x-text="
                                    log.reason === 'signup_approved' ? '가입 승인' :
                                    log.reason === 'post_created' ? '게시글 작성' :
                                    log.reason === 'comment_created' ? '댓글 작성' :
                                    log.reason === 'like_received' ? '게시글 좋아요 받음' : log.reason
                                "></span>
                                <div class="text-xs sm:text-sm text-text-muted mt-0.5" x-text="new Date(log.created_at).toLocaleString()"></div>
                            </div>
                            <div class="font-bold shrink-0 text-base sm:text-lg" :class="log.amount > 0 ? 'text-accent' : 'text-danger'">
                                <span x-text="log.amount > 0 ? '+' : ''"></span><span x-text="log.amount"></span>
                            </div>
                        </li>
                    </template>
                    <template x-if="profile.logs.length === 0">
                        <li class="p-8 text-center text-text-secondary">아직 활동 내역이 없습니다.</li>
                    </template>
                </ul>
            </div>

            <!-- Activities -->
            <div x-show="activeTab === 'activities'" class="space-y-6" style="display:none;">
                <!-- Posts -->
                <div class="bg-bg-surface border border-border rounded-xl shadow-lg overflow-hidden">
                    <div class="px-4 sm:px-6 py-3 border-b border-border bg-bg-base">
                        <h3 class="text-sm font-bold text-text-primary">최근 작성한 글</h3>
                    </div>
                    <ul class="divide-y divide-border">
                        <template x-if="activities && activities.posts.length > 0">
                            <template x-for="post in activities.posts" :key="post.id">
                                <li>
                                    <a :href="`/post/${post.id}`" class="block px-4 sm:px-6 py-3 hover:bg-bg-raised transition">
                                        <div class="text-sm font-medium text-text-primary mb-1 line-clamp-1" x-text="post.title"></div>
                                        <div class="text-xs text-text-muted" x-text="new Date(post.created_at).toLocaleString()"></div>
                                    </a>
                                </li>
                            </template>
                        </template>
                        <template x-if="!activities || activities.posts.length === 0">
                            <li class="p-6 text-center text-text-secondary text-sm">작성한 글이 없습니다.</li>
                        </template>
                    </ul>
                </div>
                
                <!-- Comments -->
                <div class="bg-bg-surface border border-border rounded-xl shadow-lg overflow-hidden">
                    <div class="px-4 sm:px-6 py-3 border-b border-border bg-bg-base">
                        <h3 class="text-sm font-bold text-text-primary">최근 작성한 댓글</h3>
                    </div>
                    <ul class="divide-y divide-border">
                        <template x-if="activities && activities.comments.length > 0">
                            <template x-for="comment in activities.comments" :key="comment.id">
                                <li>
                                    <a :href="`/post/${comment.post_id}`" class="block px-4 sm:px-6 py-3 hover:bg-bg-raised transition">
                                        <div class="text-sm text-text-primary mb-1 line-clamp-2" x-text="comment.content"></div>
                                        <div class="text-xs text-text-muted" x-text="new Date(comment.created_at).toLocaleString()"></div>
                                    </a>
                                </li>
                            </template>
                        </template>
                        <template x-if="!activities || activities.comments.length === 0">
                            <li class="p-6 text-center text-text-secondary text-sm">작성한 댓글이 없습니다.</li>
                        </template>
                    </ul>
                </div>
            </div>
        </div>
    </template>
</div>
{% endblock %}
