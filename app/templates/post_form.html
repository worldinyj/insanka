{% extends "base.html" %}

{% block title %}글쓰기 - 인산가{% endblock %}

{% block content %}
<div class="max-w-4xl w-full bg-bg-surface border border-border p-8 rounded-xl shadow-lg" x-data="{
    slug: '{{ slug }}',
    title: '',
    content: '',
    postType: new URLSearchParams(window.location.search).get('type') === 'disclosure' ? 'disclosure' : 'feed',
    disclosureTag: '실적',
    submitting: false,
    async submitPost() {
        if(!this.title.trim() || !this.content.trim()) {
            showToast('제목과 내용을 모두 입력해주세요.', 'error');
            return;
        }
        
        this.submitting = true;
        try {
            const payload = { title: this.title, content: this.content, post_type: this.postType };
            if (this.postType === 'disclosure') {
                payload.disclosure_tag = this.disclosureTag;
            }
            
            const res = await fetch(`/api/v1/rooms/${this.slug}/posts`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            
            if (res.ok) {
                const data = await res.json();
                showToast('게시글이 등록되었습니다!', 'success');
                setTimeout(() => { window.location.href = `/post/${data.id}`; }, 500);
            } else {
                showToast('게시글 작성에 실패했습니다.', 'error');
            }
        } finally {
            this.submitting = false;
        }
    }
}">

    <h1 class="text-2xl font-bold mb-6 text-text-primary border-b border-border pb-4" x-text="postType === 'disclosure' ? '공시 작성' : '게시글 작성'"></h1>

    <form @submit.prevent="submitPost()" class="space-y-6">
        
        <template x-if="postType === 'disclosure'">
            <div>
                <label class="block text-sm font-medium text-text-secondary mb-1">공시 분류</label>
                <select x-model="disclosureTag" class="w-full px-4 py-2 bg-bg-base border border-border rounded-md focus:border-accent focus:outline-none transition">
                    <option value="실적">실적</option>
                    <option value="지분변동">지분변동</option>
                    <option value="계약">계약</option>
                    <option value="인사">인사</option>
                    <option value="감사">감사</option>
                    <option value="기타">기타</option>
                </select>
            </div>
        </template>

        <div>
            <label class="block text-sm font-medium text-text-secondary mb-1">제목</label>
            <input type="text" x-model="title" required placeholder="제목을 입력하세요" class="w-full px-4 py-2 bg-bg-base border border-border rounded-md focus:border-accent focus:outline-none transition">
        </div>

        <div>
            <label class="block text-sm font-medium text-text-secondary mb-1">내용</label>
            <div id="editor-container" class="bg-bg-base border border-border rounded-md min-h-[400px]"></div>
        </div>

        <div class="flex justify-end gap-3 pt-4">
            <a :href="`/room/${slug}`" class="px-6 py-2.5 border border-border text-text-primary rounded-md hover:bg-bg-raised transition text-sm font-medium text-center">취소</a>
            <button type="submit" :disabled="submitting"
                    class="px-6 py-2.5 bg-accent text-white font-medium text-sm rounded-md hover:bg-opacity-90 transition disabled:opacity-50 min-w-[80px]"
                    x-text="submitting ? '등록 중...' : '등록'">
            </button>
        </div>
    </form>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        const editor = new Quill('#editor-container', {
            theme: 'snow',
            placeholder: '내용을 입력하세요...',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    ['blockquote', 'code-block'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['link', 'image'],
                    ['clean']
                ]
            }
        });

        // Custom Image Handler for Quill
        editor.getModule('toolbar').addHandler('image', () => {
            const input = document.createElement('input');
            input.setAttribute('type', 'file');
            input.setAttribute('accept', 'image/*');
            input.click();

            input.onchange = async () => {
                const file = input.files[0];
                if (!file) return;

                const formData = new FormData();
                formData.append('file', file);

                try {
                    const res = await fetch('/api/v1/posts/upload-image', {
                        method: 'POST',
                        body: formData
                    });
                    if (res.ok) {
                        const data = await res.json();
                        const range = editor.getSelection();
                        editor.insertEmbed(range.index, 'image', data.url);
                    } else {
                        const err = await res.json();
                        showToast(err.detail || '이미지 업로드 실패', 'error');
                    }
                } catch (e) {
                    showToast('이미지 업로드 중 오류가 발생했습니다.', 'error');
                }
            };
        });

        // Sync Quill content to Alpine.js
        const alpineEl = document.querySelector('[x-data]');
        editor.on('text-change', function() {
            alpineEl.__x.$data.content = editor.root.innerHTML;
        });
    });
</script>
{% endblock %}
