{% extends "base.html" %}
{% block title %}홈 - Insanka{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto w-full" x-data="{
    loading: true,
    dashboardData: null,
    activeVote: null,
    selectedOptions: [],
    voteLoading: false,
    async init() {
        try {
            const [resDash, resVote] = await Promise.all([
                fetch('/api/v1/dashboard/home'),
                fetch('/api/v1/votes/active')
            ]);
            if (resDash.ok) {
                this.dashboardData = await resDash.json();
            }
            if (resVote.ok) {
                const voteData = await resVote.json();
                this.activeVote = voteData.vote;
            }
        } catch(e) {
            console.error('Failed to load dashboard data', e);
        } finally {
            this.loading = false;
        }
    },
    async castVote() {
        let payload = this.selectedOptions;
        if(!Array.isArray(payload)) {
            if(!payload) payload = [];
            else payload = [parseInt(payload)];
        } else {
            payload = payload.map(id => parseInt(id));
        }

        if(payload.length === 0 || isNaN(payload[0])) {
            showToast('항목을 선택해주세요.', 'warning');
            return;
        }
        this.voteLoading = true;
        try {
            const res = await fetch(`/api/v1/votes/${this.activeVote.id}/cast`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if(res.ok) {
                showToast('투표가 완료되었습니다.', 'success');
                // Reload vote data
                const resVote = await fetch('/api/v1/votes/active');
                if(resVote.ok) {
                    const voteData = await resVote.json();
                    this.activeVote = voteData.vote;
                }
            } else {
                const err = await res.json();
                showToast(err.detail || '투표 실패', 'error');
            }
        } finally {
            this.voteLoading = false;
        }
    }
}">
    <!-- Loading State -->
    <div x-show="loading" class="flex justify-center items-center py-20">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-accent"></div>
    </div>

    <!-- Content State -->
    <div x-show="!loading && dashboardData" class="flex flex-col lg:flex-row gap-8" style="display: none;">
        
        <!-- Left Main Area (Recent Feed) -->
        <div class="lg:w-2/3">
            <div class="flex items-center justify-between mb-6 border-b border-border pb-4">
                <h2 class="text-xl font-bold text-text-primary flex items-center">
                    <svg class="w-6 h-6 mr-2 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9.5L18.5 7H20a2 2 0 012 2v10a2 2 0 01-2 2h-2z"></path></svg>
                    최신 피드
                </h2>
                <a href="/room/general" class="text-sm text-text-secondary hover:text-accent transition">전체보기</a>
            </div>

            <div class="space-y-4">
                <template x-if="dashboardData && dashboardData.feed.length > 0">
                    <template x-for="post in dashboardData.feed" :key="post.id">
                        <div class="bg-bg-surface p-5 rounded-lg border border-border shadow-sm hover:shadow-md transition cursor-pointer" @click="window.location.href = `/post/${post.id}`">
                            <div class="flex items-center space-x-2 text-xs sm:text-sm text-text-secondary mb-2">
                                <span class="bg-border text-text-secondary px-2 py-0.5 rounded text-xs font-bold" x-text="post.room_slug"></span>
                                <span class="bg-accent bg-opacity-20 text-accent px-2 py-0.5 rounded-full font-bold" x-text="`Lv.${post.author.level}`"></span>
                                <span class="font-medium text-text-primary" x-text="post.author.username"></span>
                                <span>•</span>
                                <span x-text="new Date(post.created_at).toLocaleDateString()" class="text-text-muted"></span>
                            </div>
                            <h3 class="text-lg font-bold text-text-primary mb-2 line-clamp-1" x-text="post.title"></h3>
                            <p class="text-sm text-text-secondary line-clamp-2" x-text="post.content_preview"></p>
                        </div>
                    </template>
                </template>
                <template x-if="dashboardData && dashboardData.feed.length === 0">
                    <div class="text-center py-10 bg-bg-surface rounded-lg border border-border">
                        <p class="text-text-secondary">최신 피드가 없습니다.</p>
                    </div>
                </template>
            </div>
        </div>

        <!-- Right Sidebar Area -->
        <div class="lg:w-1/3 space-y-8">
            
            <!-- Disclosures Widget -->
            <div class="bg-bg-surface rounded-lg border border-border shadow-sm p-5">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-border">
                    <h2 class="text-lg font-bold text-text-primary flex items-center">
                        <svg class="w-5 h-5 mr-2 text-info" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                        공시방 <span class="ml-2 px-1.5 py-0.5 bg-accent bg-opacity-10 text-accent text-[10px] rounded-full align-middle">공식</span>
                    </h2>
                    <a href="/room/general?type=disclosure" class="text-xs text-text-secondary hover:text-accent transition">더보기</a>
                </div>
                
                <div class="space-y-3">
                    <template x-if="dashboardData && dashboardData.disclosures.length > 0">
                        <template x-for="disc in dashboardData.disclosures" :key="disc.id">
                            <a :href="`/post/${disc.id}`" class="block group">
                                <div class="flex items-start">
                                    <template x-if="disc.disclosure_tag">
                                        <span class="px-2 py-0.5 bg-info text-white text-[10px] font-bold rounded mt-0.5 mr-2 whitespace-nowrap" x-text="disc.disclosure_tag"></span>
                                    </template>
                                    <div>
                                        <p class="text-sm font-medium text-text-primary group-hover:text-accent transition line-clamp-2" x-text="disc.title"></p>
                                        <p class="text-[10px] text-text-muted mt-1" x-text="new Date(disc.created_at).toLocaleDateString()"></p>
                                    </div>
                                </div>
                            </a>
                        </template>
                    </template>
                    <template x-if="dashboardData && dashboardData.disclosures.length === 0">
                        <p class="text-sm text-text-secondary text-center py-4">최근 공시가 없습니다.</p>
                    </template>
                </div>
            </div>

            <!-- Upcoming Events Widget -->
            <div class="bg-bg-surface rounded-lg border border-border shadow-sm p-5">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-border">
                    <h2 class="text-lg font-bold text-text-primary flex items-center">
                        <svg class="w-5 h-5 mr-2 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        주요 일정 (Upcoming)
                    </h2>
                </div>
                
                <div class="space-y-3">
                    <template x-if="dashboardData && dashboardData.events && dashboardData.events.length > 0">
                        <template x-for="evt in dashboardData.events" :key="evt.id">
                            <div class="flex items-start group">
                                <div class="flex flex-col items-center justify-center bg-bg-raised rounded p-2 min-w-[3.5rem] mr-3 border border-border">
                                    <span class="text-[10px] font-bold text-text-secondary uppercase leading-none" x-text="new Date(evt.start_time).toLocaleString('en-US', {month: 'short'})"></span>
                                    <span class="text-lg font-bold text-text-primary leading-none mt-1" x-text="new Date(evt.start_time).getDate()"></span>
                                </div>
                                <div class="flex-1 mt-1">
                                    <p class="text-sm font-bold text-text-primary line-clamp-1 group-hover:text-accent transition" x-text="evt.title"></p>
                                    <p class="text-[10px] text-text-muted mt-0.5" x-text="new Date(evt.start_time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + (evt.location ? ` · ${evt.location}` : '')"></p>
                                </div>
                            </div>
                        </template>
                    </template>
                    <template x-if="dashboardData && (!dashboardData.events || dashboardData.events.length === 0)">
                        <p class="text-sm text-text-secondary text-center py-4">예정된 일정이 없습니다.</p>
                    </template>
                </div>
            </div>

            <!-- Active Vote Widget -->
            <template x-if="activeVote">
                <div class="bg-bg-surface rounded-lg border border-border shadow-sm p-5">
                    <div class="flex items-center justify-between mb-4 pb-3 border-b border-border">
                        <h2 class="text-lg font-bold text-text-primary flex items-center">
                            <svg class="w-5 h-5 mr-2 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            진행 중인 투표
                        </h2>
                    </div>
                    
                    <div class="space-y-4">
                        <h3 class="font-bold text-text-primary text-base" x-text="activeVote.title"></h3>
                        <p class="text-xs text-text-secondary" x-show="activeVote.is_multiple">복수 선택 가능</p>
                        
                        <div class="space-y-2">
                            <template x-for="opt in activeVote.options" :key="opt.id">
                                <div>
                                    <!-- Voting Mode -->
                                    <template x-if="!activeVote.has_voted">
                                        <label class="flex items-center p-3 border border-border rounded-lg cursor-pointer hover:bg-bg-raised transition"
                                               :class="selectedOptions.includes(opt.id) ? 'border-accent bg-accent bg-opacity-5' : ''">
                                            <input :type="activeVote.is_multiple ? 'checkbox' : 'radio'" 
                                                   :name="'vote_opt'" 
                                                   :value="opt.id" 
                                                   x-model="selectedOptions"
                                                   class="text-accent focus:ring-accent bg-bg-base border-border"
                                                   :class="activeVote.is_multiple ? 'rounded' : 'rounded-full'">
                                            <span class="ml-3 text-sm font-medium text-text-primary" x-text="opt.text"></span>
                                        </label>
                                    </template>
                                    
                                    <!-- Results Mode -->
                                    <template x-if="activeVote.has_voted">
                                        <div class="relative w-full border border-border rounded-lg overflow-hidden bg-bg-base p-3">
                                            <div class="absolute top-0 left-0 h-full bg-accent bg-opacity-20 transition-all duration-500" :style="`width: ${opt.percentage}%`"></div>
                                            <div class="relative flex justify-between text-sm font-medium">
                                                <span class="text-text-primary flex items-center">
                                                    <span x-text="opt.text"></span>
                                                    <svg x-show="opt.is_voted" class="w-4 h-4 ml-2 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                                                </span>
                                                <span class="text-text-secondary">
                                                    <span x-text="opt.percentage + '%'"></span>
                                                    <span class="text-xs ml-1" x-text="`(${opt.count}표)`"></span>
                                                </span>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                        
                        <div class="mt-4 flex items-center justify-between">
                            <span class="text-xs text-text-secondary" x-text="`총 ${activeVote.total_votes}표 참여`"></span>
                            <template x-if="!activeVote.has_voted">
                                <button @click="castVote()" :disabled="voteLoading" class="px-4 py-2 bg-accent text-bg-base text-sm font-medium rounded-lg hover:opacity-90 transition disabled:opacity-50">
                                    <span x-text="voteLoading ? '투표 중...' : '투표하기'"></span>
                                </button>
                            </template>
                            <template x-if="activeVote.has_voted">
                                <span class="px-3 py-1 bg-success bg-opacity-20 text-success text-xs font-bold rounded-full">투표 완료</span>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Leaderboard Widget -->
            <div class="bg-bg-surface rounded-lg border border-border shadow-sm p-5">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-border">
                    <h2 class="text-lg font-bold text-text-primary flex items-center">
                        <svg class="w-5 h-5 mr-2 text-warning" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
                        명예의 전당 Top 5
                    </h2>
                    <a href="/ranking" class="text-xs text-text-secondary hover:text-accent transition">전체보기</a>
                </div>

                <div class="space-y-3">
                    <template x-if="dashboardData && dashboardData.leaderboard.length > 0">
                        <template x-for="user in dashboardData.leaderboard" :key="user.username">
                            <div class="flex items-center justify-between p-2 rounded hover:bg-bg-base transition">
                                <div class="flex items-center">
                                    <div class="w-6 text-center mr-3 font-bold" 
                                         :class="{
                                            'text-yellow-500': user.rank === 1,
                                            'text-gray-400': user.rank === 2,
                                            'text-amber-600': user.rank === 3,
                                            'text-text-muted': user.rank > 3
                                         }"
                                         x-text="user.rank"></div>
                                    <div class="flex flex-col">
                                        <span class="text-sm font-medium text-text-primary" x-text="user.username"></span>
                                        <span class="text-[10px] text-accent font-semibold" x-text="`Lv.${user.level}`"></span>
                                    </div>
                                </div>
                                <span class="text-sm font-bold text-text-secondary" x-text="user.points.toLocaleString() + ' P'"></span>
                            </div>
                        </template>
                    </template>
                    <template x-if="dashboardData && dashboardData.leaderboard.length === 0">
                        <p class="text-sm text-text-secondary text-center py-4">랭킹 데이터가 없습니다.</p>
                    </template>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
