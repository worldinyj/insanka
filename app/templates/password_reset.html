{% extends "base.html" %}

{% block title %}비밀번호 재설정 - 인산가{% endblock %}

{% block content %}
<div class="max-w-md w-full bg-bg-surface border border-border p-8 rounded-xl shadow-lg mt-12" x-data="{ 
    mode: new URLSearchParams(window.location.search).get('token') ? 'confirm' : 'request', 
    token: new URLSearchParams(window.location.search).get('token'),
    submitting: false, 
    error: null 
}">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-text-primary" x-text="mode === 'request' ? '비밀번호 찾기' : '새 비밀번호 설정'"></h1>
        <p class="text-text-secondary mt-2" x-text="mode === 'request' ? '가입하신 이메일을 입력하시면 재설정 링크를 보내드립니다.' : '새로운 비밀번호를 입력해 주세요.'"></p>
    </div>

    <!-- 비밀번호 재설정 요청 폼 -->
    <template x-if="mode === 'request'">
        <form class="space-y-6" 
              @submit.prevent="
                  submitting = true; error = null;
                  const formData = new FormData($event.target);
                  const payload = Object.fromEntries(formData.entries());
                  fetch('/api/v1/auth/password-reset/request', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify(payload)
                  }).then(async res => {
                      const data = await res.json();
                      if (res.ok) {
                          showToast(data.message, 'success');
                          setTimeout(() => { window.location.href = '/login'; }, 3000);
                      } else {
                          error = data.detail || '요청에 실패했습니다.';
                          showToast(error, 'error');
                      }
                      submitting = false;
                  }).catch(() => {
                      error = '네트워크 오류가 발생했습니다.';
                      showToast(error, 'error');
                      submitting = false;
                  });
              ">
            
            <template x-if="error">
                <div class="p-3 bg-danger bg-opacity-20 border border-danger text-danger text-sm rounded-md" x-text="error"></div>
            </template>

            <div>
                <label class="block text-sm font-medium text-text-secondary mb-1">이메일</label>
                <input type="email" name="email" required placeholder="가입하신 이메일 주소" class="w-full px-4 py-2 bg-bg-base border border-border rounded-md focus:border-accent focus:outline-none transition text-text-primary">
            </div>

            <button type="submit" :disabled="submitting" class="w-full py-3 bg-accent text-bg-base font-bold rounded-md hover:bg-opacity-90 transition disabled:opacity-50" x-text="submitting ? '발송 중...' : '재설정 링크 받기'"></button>

            <div class="text-center mt-4">
                <a href="/login" class="text-sm text-text-secondary hover:text-accent">로그인으로 돌아가기</a>
            </div>
        </form>
    </template>

    <!-- 비밀번호 재설정 확정 폼 -->
    <template x-if="mode === 'confirm'">
        <form class="space-y-6" 
              @submit.prevent="
                  submitting = true; error = null;
                  const formData = new FormData($event.target);
                  const payload = Object.fromEntries(formData.entries());
                  payload.token = token;
                  fetch('/api/v1/auth/password-reset/confirm', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify(payload)
                  }).then(async res => {
                      const data = await res.json();
                      if (res.ok) {
                          showToast(data.message, 'success');
                          setTimeout(() => { window.location.href = '/login'; }, 2000);
                      } else {
                          error = data.detail || '재설정에 실패했습니다.';
                          showToast(error, 'error');
                      }
                      submitting = false;
                  }).catch(() => {
                      error = '네트워크 오류가 발생했습니다.';
                      showToast(error, 'error');
                      submitting = false;
                  });
              ">
            
            <template x-if="error">
                <div class="p-3 bg-danger bg-opacity-20 border border-danger text-danger text-sm rounded-md" x-text="error"></div>
            </template>

            <div>
                <label class="block text-sm font-medium text-text-secondary mb-1">새 비밀번호</label>
                <input type="password" name="new_password" required minlength="8" placeholder="8자 이상, 숫자 및 특수문자 포함" class="w-full px-4 py-2 bg-bg-base border border-border rounded-md focus:border-accent focus:outline-none transition text-text-primary">
            </div>

            <button type="submit" :disabled="submitting" class="w-full py-3 bg-accent text-bg-base font-bold rounded-md hover:bg-opacity-90 transition disabled:opacity-50" x-text="submitting ? '설정 중...' : '비밀번호 변경'"></button>
        </form>
    </template>
</div>
{% endblock %}
